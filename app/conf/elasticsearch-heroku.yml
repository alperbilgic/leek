# Elasticsearch configuration for Heroku
cluster.name: leek-cluster
node.name: leek-node

# Paths
path.data: /opt/elasticsearch/data
path.logs: /opt/elasticsearch/logs

# Network
network.host: 0.0.0.0
http.port: 9200

# Single node cluster
discovery.type: single-node
bootstrap.memory_lock: false

# Reduce resource usage for container environment
indices.memory.index_buffer_size: 10%
indices.fielddata.cache.size: 20%

# Disable security for internal use
xpack.security.enabled: false
xpack.monitoring.enabled: false
xpack.watcher.enabled: false
xpack.graph.enabled: false
xpack.ml.enabled: false

# Logging
logger.level: ERROR

# Disable automatic index creation for security
action.auto_create_index: true

# Thread pools - reduce for container
thread_pool.write.queue_size: 200
thread_pool.search.queue_size: 1000 