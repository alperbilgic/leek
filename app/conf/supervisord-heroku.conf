# Supervisord configuration for Heroku
[supervisord]
nodaemon = true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:bootstrap]
priority = 1
command  = python /opt/app/bin/bootstrap.py
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart = false
startsecs = 0
startretries = 0

[program:api]
autostart = true
priority  = 2
command   = gunicorn --bind 0.0.0.0:5000 -c /opt/app/leek/api/server/gunicorn.py leek.api.server.wsgi:app
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart = true

[program:agent]
autostart = true
priority  = 3
command   = python -m leek.agent.agent
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart  = unexpected
exitcodes    = 0
startsecs    = 0
startretries = 3

[program:nginx]
autostart = true
priority  = 4
command   = /opt/app/bin/start-nginx-heroku.sh
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart = true 